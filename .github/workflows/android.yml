# Builds the Android app (for the Google Play Store) every time the game changes.
# The signed files appear on the repo's Releases page:
#   the-letter-<n>.aab  -> upload this one to Google Play Console
#   the-letter-<n>.apk  -> install this one directly on an Android phone to test
name: Build Android app

on:
  push:
    branches: [main]
    paths: ['play.html', 'css/**', 'js/**', 'app/**', '*.png', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor and fonts
        working-directory: app
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/1-install.log"

      - name: Prepare the game files
        working-directory: app
        run: |
          set -o pipefail
          node prepare-www.mjs 2>&1 | tee "$RUNNER_TEMP/2-prepare.log"

      - name: Create the Android project
        working-directory: app
        run: |
          set -o pipefail
          {
            npx cap add android
            npx capacitor-assets generate --android
            node customize-android.mjs "${{ github.run_number }}"
            npx cap sync android
          } 2>&1 | tee "$RUNNER_TEMP/3-android.log"

      - name: Build the signed app
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -o pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD" 2>&1 | tee "$RUNNER_TEMP/4-build.log"
          rm -f "$RUNNER_TEMP/upload.jks"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/the-letter-${{ github.run_number }}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/the-letter-${{ github.run_number }}.apk"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Publish the files on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Android app 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **The Letter for Android — version 1.0.${{ github.run_number }}**

            - `the-letter-${{ github.run_number }}.aab` — upload this to **Google Play Console**
            - `the-letter-${{ github.run_number }}.apk` — install this directly on an Android phone to test
          files: out/*

      - name: Report the error (if something went wrong)
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/*.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 45 "$f" | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$(basename "$f")::$msg"
          done
